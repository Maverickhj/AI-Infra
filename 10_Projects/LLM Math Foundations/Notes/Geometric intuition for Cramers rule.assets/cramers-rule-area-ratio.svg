<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Cramer's rule as an oriented-area ratio</title>
  <desc id="desc">Two panels show a basis parallelogram generated by alpha and beta, then the parallelogram generated by b and beta when b equals 2 alpha plus beta. The second oriented area is twice the first, so Cramer's rule recovers x equals 2.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263238"/></marker>
    <marker id="arrow-alpha" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e07a24"/></marker>
    <marker id="arrow-beta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1677b7"/></marker>
    <marker id="arrow-b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b4ab2"/></marker>
    <style>
      .title { font: 700 28px Inter, Segoe UI, sans-serif; fill: #17212b; }
      .panel-title { font: 700 23px Inter, Segoe UI, sans-serif; fill: #17212b; }
      .label { font: 600 20px Inter, Segoe UI, sans-serif; }
      .small { font: 18px Inter, Segoe UI, sans-serif; fill: #455a64; }
      .formula { font: 700 22px Cambria Math, STIX Two Math, serif; fill: #263238; }
      .axis { stroke: #90a4ae; stroke-width: 2; }
      .grid { stroke: #eceff1; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#ffffff"/>
  <text x="720" y="52" text-anchor="middle" class="title">Cramer's rule = an oriented-area ratio</text>
  <text x="720" y="83" text-anchor="middle" class="small">The coefficient is the area change after replacing one basis vector.</text>

  <rect x="35" y="110" width="650" height="585" rx="18" fill="#f8fafb" stroke="#cfd8dc" stroke-width="2"/>
  <rect x="755" y="110" width="650" height="585" rx="18" fill="#f8fafb" stroke="#cfd8dc" stroke-width="2"/>
  <text x="360" y="153" text-anchor="middle" class="panel-title">1. Original basis parallelogram</text>
  <text x="1080" y="153" text-anchor="middle" class="panel-title">2. Replace α by b = 2α + β</text>

  <!-- panel 1 grid and axes -->
  <g transform="translate(120,205)">
    <path class="grid" d="M0 0H500 M0 70H500 M0 140H500 M0 210H500 M0 280H500 M0 350H500 M0 420H500 M70 0V420 M140 0V420 M210 0V420 M280 0V420 M350 0V420 M420 0V420 M490 0V420"/>
    <path class="axis" d="M0 420H520 M0 420V-8" marker-end="url(#arrow-dark)"/>
    <polygon points="0,420 210,350 280,280 70,350" fill="#f5c28b" fill-opacity="0.52" stroke="#c66a17" stroke-width="3"/>
    <line x1="0" y1="420" x2="210" y2="350" stroke="#e07a24" stroke-width="5" marker-end="url(#arrow-alpha)"/>
    <line x1="0" y1="420" x2="70" y2="280" stroke="#1677b7" stroke-width="5" marker-end="url(#arrow-beta)"/>
    <text x="218" y="351" class="label" fill="#c66a17">α</text>
    <text x="75" y="272" class="label" fill="#1677b7">β</text>
    <text x="132" y="358" class="formula">det(α, β) = 5</text>
    <text x="7" y="445" class="small">O</text>
    <text x="502" y="445" class="small">x</text>
    <text x="-22" y="8" class="small">y</text>
  </g>

  <!-- panel 2 grid and axes -->
  <g transform="translate(800,205)">
    <path class="grid" d="M0 0H560 M0 70H560 M0 140H560 M0 210H560 M0 280H560 M0 350H560 M0 420H560 M55 0V420 M110 0V420 M165 0V420 M220 0V420 M275 0V420 M330 0V420 M385 0V420 M440 0V420 M495 0V420 M550 0V420"/>
    <path class="axis" d="M0 420H580 M0 420V-8" marker-end="url(#arrow-dark)"/>
    <polygon points="0,420 385,200 440,90 55,310" fill="#d8c7ed" fill-opacity="0.65" stroke="#7040a4" stroke-width="3"/>
    <line x1="0" y1="420" x2="165" y2="365" stroke="#e07a24" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-alpha)"/>
    <line x1="0" y1="420" x2="55" y2="310" stroke="#1677b7" stroke-width="5" marker-end="url(#arrow-beta)"/>
    <line x1="0" y1="420" x2="385" y2="200" stroke="#7b4ab2" stroke-width="5" marker-end="url(#arrow-b)"/>
    <text x="170" y="363" class="label" fill="#c66a17">α</text>
    <text x="61" y="303" class="label" fill="#1677b7">β</text>
    <text x="390" y="194" class="label" fill="#7040a4">b</text>
    <text x="132" y="275" class="formula">det(b, β) = 10</text>
    <text x="132" y="306" class="formula">= 2 det(α, β)</text>
    <text x="7" y="445" class="small">O</text>
    <text x="552" y="445" class="small">x</text>
    <text x="-22" y="8" class="small">y</text>
  </g>

  <line x1="685" y1="405" x2="748" y2="405" stroke="#455a64" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <text x="720" y="385" text-anchor="middle" class="small">replace α</text>

  <rect x="150" y="648" width="1140" height="44" rx="12" fill="#eef5f8"/>
  <text x="720" y="677" text-anchor="middle" class="small">The β-parallel part only slides the edge; the perpendicular component determines the signed height.</text>
</svg>
